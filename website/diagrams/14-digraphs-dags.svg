  <line x1="166" y1="330" x2="241" y2="240" stroke="#2d2d2d" stroke-width="1.5" marker-end="url(#ar14)"/>
  <line x1="166" y1="330" x2="241" y2="330" stroke="#c4825a" stroke-width="2" marker-end="url(#ac14)"/>
