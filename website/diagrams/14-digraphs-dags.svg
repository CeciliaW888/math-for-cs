<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t14 d14">
  <title id="t14">Getting dressed as a DAG, scheduled in parallel rounds</title>
  <desc id="d14">Eleven clothing tasks arranged in four columns by depth. Arrows show precedence. The longest path shirt, jacket, scarf, coat is highlighted, and it has four vertices, so four parallel rounds are needed and enough.</desc>
