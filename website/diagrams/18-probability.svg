  <text x="400" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#2d2d2d">Pr[switch wins] = 6 × 1/9 = <tspan fill="#c4825a">2/3</tspan>   ·   Pr[stay wins] = 6 × 1/18 = 1/3</text>
