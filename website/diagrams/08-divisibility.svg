<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Euclid algorithm drawn as cutting squares from a 21 by 9 rectangle">
<rect width="800" height="450" fill="#ffffff"/>
<text x="40" y="48" font-family="Georgia, serif" font-size="24" fill="#2d2d2d">Euclid’s algorithm as square-cutting: gcd(21, 9)</text>
<rect x="50" y="130" width="420" height="180" fill="none" stroke="#2d2d2d" stroke-width="2"/>
<rect x="50" y="130" width="180" height="180" fill="#fbe9dd" stroke="#c4825a" stroke-width="2"/>
<text x="140.0" y="226.0" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#2d2d2d">9 × 9</text>
<rect x="230" y="130" width="180" height="180" fill="#fbe9dd" stroke="#c4825a" stroke-width="2"/>
<text x="320.0" y="226.0" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#2d2d2d">9 × 9</text>
<rect x="410" y="130" width="60" height="60" fill="#e8efe9" stroke="#6b8f71" stroke-width="2"/>
<text x="440.0" y="165.0" text-anchor="middle" font-family="Helvetica Neue, sans-serif" font-size="14" fill="#2d2d2d">3</text>
<rect x="410" y="190" width="60" height="60" fill="#e8efe9" stroke="#6b8f71" stroke-width="2"/>
<text x="440.0" y="225.0" text-anchor="middle" font-family="Helvetica Neue, sans-serif" font-size="14" fill="#2d2d2d">3</text>
<rect x="410" y="250" width="60" height="60" fill="#e8efe9" stroke="#6b8f71" stroke-width="2"/>
<text x="440.0" y="285.0" text-anchor="middle" font-family="Helvetica Neue, sans-serif" font-size="14" fill="#2d2d2d">3</text>
<line x1="50" y1="112" x2="470" y2="112" stroke="#7a8fa6" stroke-width="1.5"/>
<text x="260.0" y="104" text-anchor="middle" font-family="Helvetica Neue, sans-serif" font-size="16" fill="#7a8fa6">21</text>
<line x1="36" y1="130" x2="36" y2="310" stroke="#7a8fa6" stroke-width="1.5"/>
<text x="28" y="225.0" text-anchor="end" font-family="Helvetica Neue, sans-serif" font-size="16" fill="#7a8fa6">9</text>
<text x="50" y="346" font-family="Helvetica Neue, sans-serif" font-size="15" fill="#2d2d2d">Cut as many 9 × 9 squares as fit: 21 = 2·9 + 3</text>
<text x="50" y="370" font-family="Helvetica Neue, sans-serif" font-size="15" fill="#2d2d2d">The 3 × 9 leftover splits exactly into 3 × 3 squares: 9 = 3·3 + 0</text>
<rect x="530" y="120" width="240" height="200" rx="10" fill="#f5f0eb" stroke="#e0d6cc" stroke-width="1.5"/>
<text x="550" y="152" font-family="Helvetica Neue, sans-serif" font-size="15" fill="#6b6b6b">state (x, y) → (y, x rem y)</text>
<text x="570" y="192" font-family="Georgia, serif" font-size="20" fill="#2d2d2d">(21, 9)</text>
<text x="680" y="216" font-family="Helvetica Neue, sans-serif" font-size="14" fill="#c4825a">↓ rem</text>
<text x="570" y="236" font-family="Georgia, serif" font-size="20" fill="#2d2d2d">(9, 3)</text>
<text x="680" y="260" font-family="Helvetica Neue, sans-serif" font-size="14" fill="#c4825a">↓ rem</text>
<text x="570" y="280" font-family="Georgia, serif" font-size="20" fill="#2d2d2d">(3, 0)</text>
<text x="550" y="310" font-family="Georgia, serif" font-size="18" fill="#c4825a">y = 0, so gcd = 3</text>
<text x="50" y="420" font-family="Helvetica Neue, sans-serif" font-size="15" fill="#6b6b6b">The side of the last square that tiles the leftover exactly is the greatest common divisor.</text>
</svg>