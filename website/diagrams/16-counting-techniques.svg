<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Division rule: five permutations map to one circular seating">
  <defs>
    <marker id="arr16" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#c4825a" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#2d2d2d">The division rule: 5 line-ups, 1 round table</text>
  <text x="190" y="92" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#6b8f71">permutations (5! = 120 in all)</text>

  <g font-family="'JetBrains Mono', monospace" font-size="18" fill="#2d2d2d" text-anchor="middle">
    <rect x="100" y="110" width="180" height="36" rx="6" fill="#f5f0eb" stroke="#6b8f71" stroke-width="1.5"/>
    <text x="190" y="134">4 5 2 3 1</text>
    <rect x="100" y="160" width="180" height="36" rx="6" fill="#f5f0eb" stroke="#6b8f71" stroke-width="1.5"/>
    <text x="190" y="184">5 2 3 1 4</text>
    <rect x="100" y="210" width="180" height="36" rx="6" fill="#f5f0eb" stroke="#6b8f71" stroke-width="1.5"/>
    <text x="190" y="234">2 3 1 4 5</text>
    <rect x="100" y="260" width="180" height="36" rx="6" fill="#f5f0eb" stroke="#6b8f71" stroke-width="1.5"/>
    <text x="190" y="284">3 1 4 5 2</text>
    <rect x="100" y="310" width="180" height="36" rx="6" fill="#f5f0eb" stroke="#6b8f71" stroke-width="1.5"/>
    <text x="190" y="334">1 4 5 2 3</text>
  </g>

  <g stroke="#c4825a" stroke-width="1.5" fill="none" marker-end="url(#arr16)">
    <path d="M285,128 C380,128 420,210 470,240"/>
    <path d="M285,178 C380,178 420,230 470,246"/>
    <path d="M285,228 C380,228 420,250 470,252"/>
    <path d="M285,278 C380,278 420,270 470,258"/>
    <path d="M285,328 C380,328 420,290 470,264"/>
  </g>

  <circle cx="600" cy="250" r="78" fill="#fbe9dd" stroke="#c4825a" stroke-width="2"/>
  <text x="600" y="256" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#2d2d2d">table</text>
  <g font-family="Georgia, serif" font-size="18" fill="#2d2d2d" text-anchor="middle">
    <circle cx="600" cy="140" r="20" fill="#ffffff" stroke="#2d2d2d" stroke-width="1.5"/>
    <text x="600" y="146">4</text>
    <circle cx="705" cy="216" r="20" fill="#ffffff" stroke="#2d2d2d" stroke-width="1.5"/>
    <text x="705" y="222">5</text>
    <circle cx="665" cy="339" r="20" fill="#ffffff" stroke="#2d2d2d" stroke-width="1.5"/>
    <text x="665" y="345">2</text>
    <circle cx="535" cy="339" r="20" fill="#ffffff" stroke="#2d2d2d" stroke-width="1.5"/>
    <text x="535" y="345">3</text>
    <circle cx="495" cy="216" r="20" fill="#ffffff" stroke="#2d2d2d" stroke-width="1.5"/>
    <text x="495" y="222">1</text>
  </g>
  <path d="M640,128 A120,120 0 0 1 712,180" fill="none" stroke="#7a8fa6" stroke-width="1.5" marker-end="url(#arr16)"/>
  <text x="712" y="140" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#7a8fa6">clockwise</text>

  <text x="400" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#2d2d2d">Every table is hit by exactly n line-ups (one per starting seat)</text>
  <text x="400" y="428" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#c4825a">so #tables = n! / n = (n − 1)!   →   5!/5 = 24</text>
</svg>
