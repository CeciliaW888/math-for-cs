<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t12 d12">
  <title id="t12">Rogue pairs and stable matchings</title>
  <desc id="d12">With A and B preferring C over D and C and D preferring A over B, the matching A–D, B–C has the rogue pair A–C, while A–C, B–D is stable. Below, the four steps of the Gale-Shapley loop.</desc>
  <defs>
    <marker id="arr12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4825a"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#2d2d2d">Stable means nobody wants to run off together</text>
  <text x="400" y="64" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2d2d2d">A and B both rank C over D · C and D both rank A over B</text>

  <!-- Left panel: unstable -->
  <rect x="30" y="80" width="360" height="230" rx="12" fill="#f5f0eb" stroke="#e0d6cc" stroke-width="1.5"/>
  <text x="210" y="108" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#c4825a">A–D, B–C: unstable</text>
  <g stroke="#2d2d2d" stroke-width="2">
    <line x1="100" y1="165" x2="320" y2="255"/>
    <line x1="100" y1="255" x2="320" y2="165"/>
  </g>
  <line x1="100" y1="165" x2="320" y2="165" stroke="#c4825a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="210" y="152" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#c4825a">rogue pair</text>
  <g font-family="Georgia, serif" font-size="18" text-anchor="middle" fill="#2d2d2d">
    <circle cx="100" cy="165" r="22" fill="#ffffff" stroke="#2d2d2d" stroke-width="1.75"/><text x="100" y="171">A</text>
    <circle cx="100" cy="255" r="22" fill="#ffffff" stroke="#2d2d2d" stroke-width="1.75"/><text x="100" y="261">B</text>
    <circle cx="320" cy="165" r="22" fill="#fbe9dd" stroke="#2d2d2d" stroke-width="1.75"/><text x="320" y="171">C</text>
    <circle cx="320" cy="255" r="22" fill="#fbe9dd" stroke="#2d2d2d" stroke-width="1.75"/><text x="320" y="261">D</text>
  </g>
  <text x="210" y="298" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2d2d2d">A prefers C to D, and C prefers A to B</text>

  <!-- Right panel: stable -->
  <rect x="410" y="80" width="360" height="230" rx="12" fill="#f5f0eb" stroke="#e0d6cc" stroke-width="1.5"/>
  <text x="590" y="108" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#6b8f71">A–C, B–D: stable</text>
  <g stroke="#6b8f71" stroke-width="2">
    <line x1="480" y1="165" x2="700" y2="165"/>
    <line x1="480" y1="255" x2="700" y2="255"/>
  </g>
  <g font-family="Georgia, serif" font-size="18" text-anchor="middle" fill="#2d2d2d">
    <circle cx="480" cy="165" r="22" fill="#ffffff" stroke="#2d2d2d" stroke-width="1.75"/><text x="480" y="171">A</text>
    <circle cx="480" cy="255" r="22" fill="#ffffff" stroke="#2d2d2d" stroke-width="1.75"/><text x="480" y="261">B</text>
    <circle cx="700" cy="165" r="22" fill="#fbe9dd" stroke="#2d2d2d" stroke-width="1.75"/><text x="700" y="171">C</text>
    <circle cx="700" cy="255" r="22" fill="#fbe9dd" stroke="#2d2d2d" stroke-width="1.75"/><text x="700" y="261">D</text>
  </g>
  <text x="590" y="298" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2d2d2d">A and C got their top choices, so nobody defects</text>

  <!-- Gale-Shapley loop -->
  <g font-family="sans-serif" font-size="14" fill="#2d2d2d" text-anchor="middle">
    <rect x="30" y="340" width="165" height="70" rx="10" fill="#ffffff" stroke="#c4825a" stroke-width="1.5"/>
    <text x="112" y="368">1. Unheld applicants</text><text x="112" y="390">propose down their list</text>
    <rect x="215" y="340" width="165" height="70" rx="10" fill="#ffffff" stroke="#c4825a" stroke-width="1.5"/>
    <text x="297" y="368">2. Each evaluator</text><text x="297" y="390">holds its favourite</text>
    <rect x="400" y="340" width="165" height="70" rx="10" fill="#ffffff" stroke="#c4825a" stroke-width="1.5"/>
    <text x="482" y="368">3. Everyone else is</text><text x="482" y="390">rejected for good</text>
    <rect x="585" y="340" width="185" height="70" rx="10" fill="#fbe9dd" stroke="#6b8f71" stroke-width="1.5"/>
    <text x="677" y="368">4. Stop on a day</text><text x="677" y="390">with no rejections</text>
  </g>
  <g stroke="#c4825a" stroke-width="1.75" marker-end="url(#arr12)">
    <line x1="195" y1="375" x2="212" y2="375"/>
    <line x1="380" y1="375" x2="397" y2="375"/>
    <line x1="565" y1="375" x2="582" y2="375"/>
  </g>
  <text x="400" y="436" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#2d2d2d">Gale-Shapley: at most n² rejections, so it always stops, and the result is always stable.</text>
</svg>
