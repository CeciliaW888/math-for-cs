<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t11 d11">
  <title id="t11">Exam conflict graph with a proper 3-coloring</title>
  <desc id="d11">Five classes; edges join classes that share a student. A 3-coloring gives three exam slots, and a triangle proves two slots are not enough, so the chromatic number is 3.</desc>
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#2d2d2d">Coloring = scheduling exams without clashes</text>

  <!-- triangle highlight -->
  <polygon points="170,140 330,140 250,270" fill="#fbe9dd" stroke="none"/>

  <!-- edges -->
  <g stroke="#2d2d2d" stroke-width="1.75" fill="none">
    <line x1="170" y1="140" x2="330" y2="140"/>
    <line x1="170" y1="140" x2="250" y2="270"/>
    <line x1="330" y1="140" x2="250" y2="270"/>
    <line x1="170" y1="140" x2="80" y2="300"/>
    <line x1="330" y1="140" x2="420" y2="300"/>
    <line x1="250" y1="270" x2="420" y2="300"/>
  </g>

  <!-- vertices: stroke colour = exam slot -->
  <g font-family="sans-serif" font-size="15" text-anchor="middle" fill="#2d2d2d">
    <circle cx="170" cy="140" r="34" fill="#f5f0eb" stroke="#c4825a" stroke-width="3"/>
    <text x="170" y="145">6.1200</text>
    <circle cx="330" cy="140" r="34" fill="#f5f0eb" stroke="#6b8f71" stroke-width="3"/>
    <text x="330" y="145">6.2000</text>
    <circle cx="250" cy="270" r="34" fill="#f5f0eb" stroke="#7a8fa6" stroke-width="3"/>
    <text x="250" y="275">6.3000</text>
    <circle cx="80" cy="300" r="34" fill="#f5f0eb" stroke="#6b8f71" stroke-width="3"/>
    <text x="80" y="305">6.3700</text>
    <circle cx="420" cy="300" r="34" fill="#f5f0eb" stroke="#c4825a" stroke-width="3"/>
    <text x="420" y="305">6.4100</text>
  </g>
  <text x="250" y="190" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#c4825a">triangle</text>

  <!-- legend -->
  <g font-family="sans-serif" font-size="15" fill="#2d2d2d">
    <circle cx="525" cy="95" r="10" fill="#f5f0eb" stroke="#c4825a" stroke-width="3"/>
    <text x="545" y="100">slot 1 · Monday 9am</text>
    <circle cx="525" cy="125" r="10" fill="#f5f0eb" stroke="#6b8f71" stroke-width="3"/>
    <text x="545" y="130">slot 2 · Monday 1pm</text>
    <circle cx="525" cy="155" r="10" fill="#f5f0eb" stroke="#7a8fa6" stroke-width="3"/>
    <text x="545" y="160">slot 3 · Tuesday 9am</text>
  </g>

  <!-- two halves of the proof -->
  <rect x="505" y="200" width="265" height="80" rx="10" fill="#ffffff" stroke="#6b8f71" stroke-width="1.5"/>
  <text x="520" y="228" font-family="Georgia, serif" font-size="17" fill="#6b8f71">Upper bound: χ ≤ 3</text>
  <text x="520" y="256" font-family="sans-serif" font-size="14" fill="#2d2d2d">This coloring has no clashing edge.</text>
  <rect x="505" y="295" width="265" height="80" rx="10" fill="#ffffff" stroke="#c4825a" stroke-width="1.5"/>
  <text x="520" y="323" font-family="Georgia, serif" font-size="17" fill="#c4825a">Lower bound: χ ≥ 3</text>
  <text x="520" y="351" font-family="sans-serif" font-size="14" fill="#2d2d2d">The triangle needs 3 different slots.</text>

  <line x1="40" y1="395" x2="760" y2="395" stroke="#e0d6cc" stroke-width="1.5"/>
  <text x="400" y="428" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2d2d2d">Edge = a shared student. Same colour = same exam slot, allowed only with no edge.</text>
</svg>
