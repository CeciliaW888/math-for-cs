<rect x="170.0" y="204.1" width="80" height="155.9" fill="#fbe9dd" stroke="#c4825a" stroke-width="1.5"/>
<rect x="250.0" y="180.0" width="80" height="180.0" fill="#fbe9dd" stroke="#c4825a" stroke-width="1.5"/>
<rect x="330.0" y="158.8" width="80" height="201.2" fill="#fbe9dd" stroke="#c4825a" stroke-width="1.5"/>
<rect x="410.0" y="139.5" width="80" height="220.5" fill="#fbe9dd" stroke="#c4825a" stroke-width="1.5"/>
<rect x="90.0" y="270.0" width="80" height="90.0" fill="#f5f0eb" stroke="#6b8f71" stroke-width="1.5"/>
<rect x="170.0" y="232.7" width="80" height="127.3" fill="#f5f0eb" stroke="#6b8f71" stroke-width="1.5"/>
<rect x="250.0" y="204.1" width="80" height="155.9" fill="#f5f0eb" stroke="#6b8f71" stroke-width="1.5"/>
<rect x="330.0" y="180.0" width="80" height="180.0" fill="#f5f0eb" stroke="#6b8f71" stroke-width="1.5"/>
