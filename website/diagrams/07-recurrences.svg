<text x="30" y="245" text-anchor="middle" font-family="Helvetica Neue, sans-serif" font-size="14" fill="#2d2d2d" transform="rotate(-90 30 245)">log₂ n levels</text>
<line x1="600" y1="80" x2="600" y2="400" stroke="#e0d6cc" stroke-width="1.5"/>
<text x="625" y="80" font-family="Helvetica Neue, sans-serif" font-size="15" fill="#6b6b6b">work at this level</text>
