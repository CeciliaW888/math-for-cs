<text x="625" y="191" font-family="Helvetica Neue, sans-serif" font-size="16" fill="#2d2d2d">2 × (n/2 − 1)</text>
<text x="625" y="271" font-family="Helvetica Neue, sans-serif" font-size="16" fill="#2d2d2d">4 × (n/4 − 1)</text>
<text x="625" y="381" font-family="Helvetica Neue, sans-serif" font-size="16" fill="#2d2d2d">n × 0 = 0</text>
<text x="625" y="326" font-family="Helvetica Neue, sans-serif" font-size="16" fill="#2d2d2d">⋮  each ≈ n</text>
<rect x="612" y="405" width="172" height="34" rx="6" fill="#fbe9dd" stroke="#c4825a" stroke-width="1.5"/>
<text x="698" y="428" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#2d2d2d">total ≈ n log₂ n</text>
<text x="60" y="430" font-family="Helvetica Neue, sans-serif" font-size="14" fill="#6b6b6b">Halving keeps the tree shallow; subtracting 1 (Hanoi) makes it n deep.</text>
