<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t13 d13">
  <title id="t13">Euler walks and tree pruning</title>
  <desc id="d13">Left: the house graph with vertex degrees; the two odd-degree corners are where any Euler walk must start and end. Right: a tree with a leaf being pruned, leaving a smaller tree with one fewer vertex and one fewer edge.</desc>
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#2d2d2d">Degrees decide Euler walks · leaves let trees shrink</text>
  <line x1="400" y1="70" x2="400" y2="420" stroke="#e6ddd3" stroke-width="1.5"/>

  <!-- Left panel: house graph -->
  <text x="200" y="80" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="17" fill="#6b8f71">The house: draw it without lifting your pen</text>
  <g stroke="#2d2d2d" stroke-width="2" fill="none">
    <line x1="200" y1="115" x2="130" y2="190"/>
    <line x1="200" y1="115" x2="270" y2="190"/>
    <line x1="130" y1="190" x2="270" y2="190"/>
    <line x1="130" y1="190" x2="130" y2="330"/>
    <line x1="270" y1="190" x2="270" y2="330"/>
    <line x1="130" y1="330" x2="270" y2="330"/>
    <line x1="130" y1="190" x2="270" y2="330"/>
    <line x1="270" y1="190" x2="130" y2="330"/>
  </g>
  <g font-family="Geist, system-ui, sans-serif" font-size="15" text-anchor="middle">
    <circle cx="200" cy="115" r="15" fill="#f5f0eb" stroke="#2d2d2d" stroke-width="1.5"/>
    <text x="200" y="120" fill="#2d2d2d">a</text>
    <circle cx="130" cy="190" r="15" fill="#f5f0eb" stroke="#2d2d2d" stroke-width="1.5"/>
    <text x="130" y="195" fill="#2d2d2d">b</text>
    <circle cx="270" cy="190" r="15" fill="#f5f0eb" stroke="#2d2d2d" stroke-width="1.5"/>
    <text x="270" y="195" fill="#2d2d2d">c</text>
    <circle cx="130" cy="330" r="15" fill="#fbe9dd" stroke="#c4825a" stroke-width="2"/>
    <text x="130" y="335" fill="#2d2d2d">d</text>
    <circle cx="270" cy="330" r="15" fill="#fbe9dd" stroke="#c4825a" stroke-width="2"/>
    <text x="270" y="335" fill="#2d2d2d">e</text>
  </g>
  <g font-family="Geist, system-ui, sans-serif" font-size="14" fill="#7a8fa6">
    <text x="222" y="108">deg 2</text>
    <text x="64" y="186">deg 4</text>
    <text x="292" y="186">deg 4</text>
  </g>
  <g font-family="Geist, system-ui, sans-serif" font-size="14" fill="#c4825a">
    <text x="40" y="365">deg 3 · start</text>
    <text x="250" y="365">deg 3 · end</text>
  </g>
  <text x="200" y="400" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="15" fill="#2d2d2d">Exactly two odd vertices, so an Euler walk</text>
  <text x="200" y="420" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="15" fill="#2d2d2d">exists and must run from d to e.</text>

  <!-- Right panel: tree pruning -->
  <text x="600" y="80" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="17" fill="#6b8f71">A tree: prune a leaf, keep a tree</text>
  <g stroke="#2d2d2d" stroke-width="2">
    <line x1="560" y1="140" x2="500" y2="230"/>
    <line x1="560" y1="140" x2="620" y2="230"/>
    <line x1="500" y1="230" x2="470" y2="320"/>
    <line x1="620" y1="230" x2="590" y2="320"/>
  </g>
  <line x1="620" y1="230" x2="700" y2="300" stroke="#c4825a" stroke-width="2" stroke-dasharray="6 5"/>
  <g font-family="Geist, system-ui, sans-serif" font-size="15" text-anchor="middle">
    <circle cx="560" cy="140" r="14" fill="#f5f0eb" stroke="#2d2d2d" stroke-width="1.5"/>
    <circle cx="500" cy="230" r="14" fill="#f5f0eb" stroke="#2d2d2d" stroke-width="1.5"/>
    <circle cx="620" cy="230" r="14" fill="#f5f0eb" stroke="#2d2d2d" stroke-width="1.5"/>
    <circle cx="470" cy="320" r="14" fill="#f5f0eb" stroke="#6b8f71" stroke-width="2"/>
    <circle cx="590" cy="320" r="14" fill="#f5f0eb" stroke="#6b8f71" stroke-width="2"/>
    <circle cx="700" cy="300" r="14" fill="#ffffff" stroke="#c4825a" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="700" y="305" fill="#c4825a">l</text>
  </g>
  <path d="M 735 270 q 20 -20 5 -45" fill="none" stroke="#c4825a" stroke-width="1.5"/>
  <text x="712" y="215" font-family="Geist, system-ui, sans-serif" font-size="14" fill="#c4825a">snip</text>
  <g font-family="Geist, system-ui, sans-serif" font-size="14" fill="#6b8f71">
    <text x="440" y="352">leaf</text>
    <text x="572" y="352">leaf</text>
  </g>
  <text x="600" y="385" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="15" fill="#2d2d2d">T: 6 vertices, 5 edges  →  T − l: 5 vertices, 4 edges</text>
  <text x="600" y="410" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="15" fill="#2d2d2d">Each prune removes one vertex and one edge,</text>
  <text x="600" y="430" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="15" fill="#2d2d2d">so edges = vertices − 1 all the way down.</text>
</svg>
