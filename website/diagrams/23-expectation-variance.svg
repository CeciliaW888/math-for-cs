<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t23">
  <title id="t23">Same mean, different spread: one stock versus four independent stocks</title>
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#2d2d2d">Same mean, different spread</text>
  <text x="400" y="66" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="15" fill="#6b6b6b">Invest $100; each stock doubles or wipes out its share with probability 1/2</text>

  <!-- panel frames -->
  <rect x="30" y="84" width="360" height="330" rx="10" fill="#fbfaf8" stroke="#e6ddd3" stroke-width="1.5"/>
  <rect x="410" y="84" width="360" height="330" rx="10" fill="#fbfaf8" stroke="#e6ddd3" stroke-width="1.5"/>
  <text x="210" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#2d2d2d">All in one stock (k = 1)</text>
  <text x="590" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#2d2d2d">Split across k = 4 stocks</text>

  <!-- baselines -->
  <line x1="50" y1="360" x2="370" y2="360" stroke="#2d2d2d" stroke-width="1.5"/>
  <line x1="430" y1="360" x2="750" y2="360" stroke="#2d2d2d" stroke-width="1.5"/>

  <!-- mean lines -->
  <line x1="210" y1="130" x2="210" y2="360" stroke="#c4825a" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="590" y1="130" x2="590" y2="360" stroke="#c4825a" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="216" y="146" font-family="Helvetica, sans-serif" font-size="14" fill="#c4825a">mean 0</text>
  <text x="596" y="146" font-family="Helvetica, sans-serif" font-size="14" fill="#c4825a">mean 0</text>

  <!-- k = 1 bars: -100 and +100, each 1/2 -->
  <rect x="50" y="140" width="40" height="220" fill="#fbe9dd" stroke="#c4825a" stroke-width="1.5"/>
  <rect x="330" y="140" width="40" height="220" fill="#fbe9dd" stroke="#c4825a" stroke-width="1.5"/>
  <text x="70" y="132" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="14" fill="#2d2d2d">1/2</text>
  <text x="350" y="132" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="14" fill="#2d2d2d">1/2</text>

  <!-- k = 4 bars: -100,-50,0,50,100 with 1,4,6,4,1 sixteenths -->
  <g fill="#e8efe9" stroke="#6b8f71" stroke-width="1.5">
    <rect x="432" y="332.5" width="36" height="27.5"/>
    <rect x="502" y="250" width="36" height="110"/>
    <rect x="572" y="195" width="36" height="165"/>
    <rect x="642" y="250" width="36" height="110"/>
    <rect x="712" y="332.5" width="36" height="27.5"/>
  </g>
  <g font-family="Helvetica, sans-serif" font-size="14" fill="#2d2d2d" text-anchor="middle">
    <text x="450" y="325">1/16</text>
    <text x="520" y="242">4/16</text>
    <text x="566" y="188">6/16</text>
    <text x="660" y="242">4/16</text>
    <text x="730" y="325">1/16</text>
  </g>

  <!-- axis labels -->
  <g font-family="Helvetica, sans-serif" font-size="14" fill="#6b6b6b" text-anchor="middle">
    <text x="70" y="380">−100</text>
    <text x="210" y="380">0</text>
    <text x="350" y="380">+100</text>
    <text x="450" y="380">−100</text>
    <text x="520" y="380">−50</text>
    <text x="590" y="380">0</text>
    <text x="660" y="380">+50</text>
    <text x="730" y="380">+100</text>
  </g>

  <!-- sigma labels -->
  <text x="210" y="402" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="16" fill="#2d2d2d">Var = 10,000   σ = 100</text>
  <text x="590" y="402" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="16" fill="#2d2d2d">Var = 2,500   σ = 50</text>

  <text x="400" y="440" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#6b6b6b">Independent pieces: variance n²/k, so four stocks halve the standard deviation.</text>
</svg>
