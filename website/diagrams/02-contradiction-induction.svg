  <text x="430" y="110" font-family="Georgia, serif" font-size="16" fill="#2d2d2d" xml:space="preserve">1. One cell is missing (✕).</text>
  <text x="430" y="150" font-family="Georgia, serif" font-size="16" fill="#6b8f71" xml:space="preserve">2. Split into four smaller quadrants.</text>
  <text x="430" y="190" font-family="Georgia, serif" font-size="16" fill="#c4825a" xml:space="preserve">3. Place one L at the centre, covering</text>
  <text x="430" y="212" font-family="Georgia, serif" font-size="16" fill="#c4825a" xml:space="preserve">    a corner of the three other quadrants.</text>
  <text x="430" y="252" font-family="Georgia, serif" font-size="16" fill="#2d2d2d" xml:space="preserve">4. Each quadrant now misses one cell:</text>
  <text x="430" y="274" font-family="Georgia, serif" font-size="16" fill="#2d2d2d" xml:space="preserve">    a smaller copy of the same problem.</text>
  <text x="430" y="314" font-family="Georgia, serif" font-size="16" fill="#2d2d2d" xml:space="preserve">5. The inductive hypothesis tiles each.</text>
  <rect x="420" y="345" width="345" height="62" rx="10" fill="#f5f0eb" stroke="#c4825a" stroke-width="1.5"/>
  <text x="592" y="372" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#2d2d2d">P(n) → P(n+1): 8 × 8 here uses</text>
  <text x="592" y="394" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#2d2d2d">21 L pieces = (64 − 1) ÷ 3</text>
