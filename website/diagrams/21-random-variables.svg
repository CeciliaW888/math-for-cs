    <rect x="70" y="323" width="90" height="30" rx="6" fill="#f5f0eb" stroke="#2d2d2d" stroke-width="1.5"/>
    <text x="115" y="344" text-anchor="middle" font-size="16">THH</text>
    <line x1="163" y1="338" x2="306" y2="300" stroke="#c4825a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="70" y="361" width="90" height="30" rx="6" fill="#f5f0eb" stroke="#2d2d2d" stroke-width="1.5"/>
