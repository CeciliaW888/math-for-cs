    <text x="330" y="382" text-anchor="middle" font-size="18">3</text>
    <line x1="470" y1="380" x2="770" y2="380" stroke="#2d2d2d" stroke-width="1.5"/>
    <line x1="470" y1="380" x2="470" y2="140" stroke="#2d2d2d" stroke-width="1.5"/>
    <rect x="490" y="310" width="50" height="70" fill="#fbe9dd" stroke="#c4825a" stroke-width="1.5"/>
