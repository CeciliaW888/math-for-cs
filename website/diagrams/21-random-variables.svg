    <rect x="70" y="209" width="90" height="30" rx="6" fill="#f5f0eb" stroke="#2d2d2d" stroke-width="1.5"/>
    <text x="115" y="230" text-anchor="middle" font-size="16">TTH</text>
    <line x1="163" y1="224" x2="306" y2="186" stroke="#c4825a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="70" y="247" width="90" height="30" rx="6" fill="#f5f0eb" stroke="#2d2d2d" stroke-width="1.5"/>
    <text x="115" y="268" text-anchor="middle" font-size="16">HHT</text>
