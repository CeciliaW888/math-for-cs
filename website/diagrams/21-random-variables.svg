    <text x="655" y="162" text-anchor="middle" font-size="15">3/8</text>
    <text x="655" y="402" text-anchor="middle" font-size="16">2</text>
    <rect x="700" y="310" width="50" height="70" fill="#fbe9dd" stroke="#c4825a" stroke-width="1.5"/>
