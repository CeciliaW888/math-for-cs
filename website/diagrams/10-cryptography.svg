<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t10 d10">
  <title id="t10">RSA with toy numbers</title>
  <desc id="d10">Bob builds keys from p = 11 and q = 17, publishes (187, 7), Alice encrypts 42 to 15, Eve sees only 15, and Bob decrypts back to 42.</desc>
  <defs>
    <marker id="arr10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4825a"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#2d2d2d">RSA: anyone can lock, only Bob can unlock</text>

  <!-- Bob's key generation -->
  <rect x="40" y="70" width="300" height="150" rx="12" fill="#f5f0eb" stroke="#2d2d2d" stroke-width="1.5"/>
  <text x="60" y="98" font-family="Georgia, serif" font-size="18" fill="#c4825a">Bob makes his keys (in private)</text>
  <g font-family="sans-serif" font-size="15" fill="#2d2d2d">
    <text x="60" y="126">primes p = 11, q = 17</text>
    <text x="60" y="150">n = p·q = 187</text>
    <text x="60" y="174">φ(n) = 10·16 = 160,  e = 7</text>
    <text x="60" y="198">d = 7⁻¹ mod 160 = 23   (secret)</text>
  </g>

  <!-- Public key -->
  <line x1="340" y1="130" x2="470" y2="130" stroke="#c4825a" stroke-width="2" marker-end="url(#arr10)"/>
  <text x="405" y="118" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2d2d2d">publish</text>
  <rect x="480" y="85" width="280" height="90" rx="12" fill="#fbe9dd" stroke="#c4825a" stroke-width="1.5"/>
  <text x="620" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#2d2d2d">Public key (n, e)</text>
  <text x="620" y="148" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2d2d2d">(187, 7) · visible to all</text>

  <!-- Message pipeline -->
  <rect x="30" y="270" width="160" height="80" rx="12" fill="#ffffff" stroke="#2d2d2d" stroke-width="1.5"/>
  <text x="110" y="302" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#2d2d2d">Alice</text>
  <text x="110" y="330" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2d2d2d">m = 42</text>

  <line x1="190" y1="310" x2="222" y2="310" stroke="#c4825a" stroke-width="2" marker-end="url(#arr10)"/>
  <rect x="225" y="270" width="170" height="80" rx="12" fill="#fbe9dd" stroke="#c4825a" stroke-width="1.5"/>
  <text x="310" y="302" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#2d2d2d">encrypt</text>
  <text x="310" y="330" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2d2d2d">42⁷ mod 187 = 15</text>

  <line x1="395" y1="310" x2="427" y2="310" stroke="#c4825a" stroke-width="2" marker-end="url(#arr10)"/>
  <rect x="430" y="270" width="150" height="80" rx="12" fill="#ffffff" stroke="#7a8fa6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="505" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#7a8fa6">open channel</text>
  <text x="505" y="330" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2d2d2d">c = 15</text>
  <!-- Eve's eye -->
  <ellipse cx="505" cy="240" rx="26" ry="12" fill="none" stroke="#7a8fa6" stroke-width="1.5"/>
  <circle cx="505" cy="240" r="5" fill="none" stroke="#7a8fa6" stroke-width="1.5"/>
  <text x="545" y="245" font-family="sans-serif" font-size="14" fill="#7a8fa6">Eve</text>

  <line x1="580" y1="310" x2="612" y2="310" stroke="#c4825a" stroke-width="2" marker-end="url(#arr10)"/>
  <rect x="615" y="270" width="160" height="80" rx="12" fill="#f5f0eb" stroke="#6b8f71" stroke-width="1.5"/>
  <text x="695" y="302" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#2d2d2d">Bob decrypts</text>
  <text x="695" y="330" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#6b8f71">15²³ mod 187 = 42</text>

  <line x1="40" y1="385" x2="760" y2="385" stroke="#e0d6cc" stroke-width="1.5"/>
  <text x="400" y="418" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2d2d2d">Eve knows n, e and c. Finding d means knowing (p−1)(q−1), and that means factoring n.</text>
</svg>
